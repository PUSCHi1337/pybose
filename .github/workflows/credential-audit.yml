name: Public credential audit (read only)
on:
  push:
    branches:
      - audit/credential-check-2026-10-30
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect-redacted-findings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install verified scanner and configuration writer
        run: |
          audit_scanner_dir="$RUNNER_TEMP/public-credential-scanner"
          mkdir -p "$audit_scanner_dir"
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$audit_scanner_dir/archive.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$audit_scanner_dir/archive.tar.gz" | sha256sum --check -
          tar -xzf "$audit_scanner_dir/archive.tar.gz" -C "$audit_scanner_dir" gitleaks
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/gitleaks/gitleaks/v8.30.1/config/gitleaks.toml --output "$audit_scanner_dir/default.toml"
          python -m pip install tomli-w==1.2.0
      - name: Audit reachable history and public repository surfaces
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_SCANNER: ${{ runner.temp }}/public-credential-scanner/gitleaks
          AUDIT_DEFAULT_CONFIG: ${{ runner.temp }}/public-credential-scanner/default.toml
          AUDIT_DEFAULT_CONFIG_BLOB: 256f64790ea6d954f0041024be2938089ae1e7a7
          AUDIT_OUTPUT: ${{ runner.temp }}/public-credential-audit
        run: python .github/scripts/credential_audit.py
      - name: Preserve redacted findings only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redacted-public-credential-audit
          path: ${{ runner.temp }}/public-credential-audit/redacted-audit.json
          if-no-files-found: error
