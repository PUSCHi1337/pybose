name: Offline unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate GitHub Actions workflow syntax
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-unit.txt

      - name: Run unit tests without network access
        run: |
          python -m pytest tests/unit --disable-socket --allow-unix-socket --timeout=10 --junitxml=junit/test-results.xml -q

      - name: Verify wheel and source distribution build
        run: |
          python -m pip install build
          python -m build
      - name: Upload library distributions
        uses: actions/upload-artifact@v4
        with:
          name: library-distributions-python-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-python-${{ matrix.python-version }}
          path: junit/test-results.xml
          if-no-files-found: warn
